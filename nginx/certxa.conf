# =============================================================================
#  nginx/certxa.conf — Certxa Application Nginx Configuration
#
#  Placeholders (replaced by scripts/setup.sh automatically):
#    __DOMAIN__    → your domain, e.g. certxa.com
#    __APP_PORT__  → Node.js app port, e.g. 8100
#    __ADMIN_EMAIL__ → your email for SSL cert
#
#  Manual install:
#    sudo sed "s/__DOMAIN__/certxa.com/g; s/__APP_PORT__/8100/g" \
#      nginx/certxa.conf > /etc/nginx/sites-available/certxa.conf
#    sudo ln -sf /etc/nginx/sites-available/certxa.conf \
#                /etc/nginx/sites-enabled/certxa.conf
#    sudo nginx -t && sudo systemctl reload nginx
#
#  After copying, run certbot to get SSL:
#    sudo certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__ \
#      --email __ADMIN_EMAIL__ --agree-tos --redirect
# =============================================================================

# ── Rate limiting zones (defined once, outside server blocks) ────────────────
limit_req_zone $binary_remote_addr zone=certxa_api:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=certxa_auth:10m rate=10r/m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__ manage.__DOMAIN__;
    return 301 https://$host$request_uri;
}

# ── Redirect www → non-www (HTTPS) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    return 301 https://__DOMAIN__$request_uri;
}

# ── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ manage.__DOMAIN__;

    client_max_body_size 55M;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ─────────────────────────────────────────────────────
    # Note: the Node app also sets most of these — nginx adds a second layer
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN  always;
    add_header X-Content-Type-Options    nosniff     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/certxa_access.log;
    error_log  /var/log/nginx/certxa_error.log warn;

    # ── Static assets — long-lived cache ────────────────────────────────────
    # Hashed filenames from Vite build are safe to cache for 1 year
    location /assets/ {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        proxy_cache_valid  200 365d;
    }

    # ── Auth endpoints — stricter rate limit ─────────────────────────────────
    location /api/auth/ {
        limit_req  zone=certxa_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ── API endpoints — standard rate limit ──────────────────────────────────
    location /api/ {
        limit_req  zone=certxa_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Everything else → Node app (with WebSocket support) ─────────────────
    location / {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for real-time features
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
