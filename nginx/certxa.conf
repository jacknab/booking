# =============================================================================
#  nginx/certxa.conf — Certxa Node.js App Nginx Configuration
#
#  ⚠️  THIS CONFIG IS FOR THE NODE.JS APP ONLY (port __APP_PORT__).
#
#  Your setup uses TWO nginx configs that must BOTH be active:
#
#    nginx/certxa-php.conf  → certxa.com (PHP marketing site, port 8422)
#    nginx/certxa.conf      → manage.certxa.com or a fresh server without
#                             the separate PHP site (Node.js app, port 8100)
#
#  On your current VPS, certxa.com is already handled by certxa-php.conf.
#  This file is here as a reference for:
#    - A fresh server where Node.js handles everything (no separate PHP site)
#    - Subdomains like manage.certxa.com pointing only at the Node.js app
#
#  Placeholders (replaced by scripts/setup.sh automatically):
#    __DOMAIN__    → your domain or subdomain, e.g. manage.certxa.com
#    __APP_PORT__  → Node.js app port, e.g. 8100
#
#  Manual install:
#    sudo sed "s/__DOMAIN__/manage.certxa.com/g; s/__APP_PORT__/8100/g" \
#      nginx/certxa.conf > /etc/nginx/sites-available/certxa-node.conf
#    sudo ln -sf /etc/nginx/sites-available/certxa-node.conf \
#                /etc/nginx/sites-enabled/certxa-node.conf
#    sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── Rate limiting zones (defined once, outside server blocks) ────────────────
# NOTE: If certxa-php.conf is also loaded, these zone names must be unique.
# Rename them if you get "duplicate zone" errors from nginx.
limit_req_zone $binary_remote_addr zone=certxa_api:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=certxa_auth:10m rate=10r/m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    client_max_body_size 55M;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN  always;
    add_header X-Content-Type-Options    nosniff     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/certxa_node_access.log;
    error_log  /var/log/nginx/certxa_node_error.log warn;

    # ── Static assets — long-lived cache ────────────────────────────────────
    location /assets/ {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Auth endpoints — stricter rate limit ─────────────────────────────────
    location /api/auth/ {
        limit_req  zone=certxa_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ── API endpoints ────────────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=certxa_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Everything else → Node app (WebSocket support included) ─────────────
    location / {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
